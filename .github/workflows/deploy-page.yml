name: Deploy Webpage Page

on:
  push:
    branches:
      - master
    paths:
      - "Webpage/Page/**"
      - "Webpage/Resource/Photos/**"
      - "Project_Document/WatchCareAI/demo/visual/**"
      - ".github/workflows/deploy-page.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Assemble website
        run: |
          mkdir -p _site/Resource/Photos _site/Project_Document/WatchCareAI/demo/visual
          cp -R Webpage/Page/. _site/
          cp -R Webpage/Resource/Photos/. _site/Resource/Photos/
          cp -R Project_Document/WatchCareAI/demo/visual/. _site/Project_Document/WatchCareAI/demo/visual/
          touch _site/.nojekyll

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
