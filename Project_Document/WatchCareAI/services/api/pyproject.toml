[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "watchcare-api"
version = "0.1.0"
description = "WatchCare AI cloud modular monolith (FastAPI). See design doc section 5.1."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Note: domain modules (shared_kernel, events/domain, alerts/domain) are
# intentionally stdlib-only so they can be unit-tested without any install.
